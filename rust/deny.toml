# The workspace's own crates are MIT (../LICENSE) with `publish = false`.

[bans]
multiple-versions = "warn"
# Path dependencies between the workspace's own (unpublished) crates are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# TLSNotary (vtop-tlsn) and the git dependencies of its tag: it is not on crates.io.
allow-git = [
  "https://github.com/tlsnotary/tlsn",
  "https://github.com/tlsnotary/tlsn-utils",
  "https://github.com/tlsnotary/mpz2",
  "https://github.com/tlsnotary/rs-merkle.git",
]
