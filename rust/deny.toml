# cargo-deny: `cargo deny check` in rust/ (CI's Rust Check and `mise run check-rust` run it).

[graph]
# The targets we build for: phones (64-bit and 32-bit Android), the servers and CI
# (x86_64 Linux) and macOS laptops. Windows-only crates stay out of the checks.
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories, unmaintained and yanked crates. Ignore one only with a reason:
# ignore = [{ id = "RUSTSEC-0000-0000", reason = "..." }]
yanked = "deny"
ignore = [
  # crypto-bigint 0.5 under tlsn's elliptic-curve 0.13 (vtop-tlsn), with no fixed 0.5 release:
  # its k256/p256 serve attestations and MPC-TLS's key exchange, neither of which a proxy-mode
  # proof runs (the prover's own TLS is rustls with ring). Drop when tlsn moves on.
  { id = "RUSTSEC-2026-0387", reason = "tlsn's curves; proxy mode runs none of their secret arithmetic" },
]

[licenses]
# What the dependency tree uses today, all permissive (MPL-2.0 is file-level copyleft:
# fine for using unchanged crates such as uniffi and cssparser). A new licence fails the
# check, so it gets a look before it lands.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # Public-domain dedication: tiny-keccak, under tlsn (vtop-tlsn).
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# TLSNotary's git crates (vtop-tlsn) leave out the license field; their READMEs license every
# crate in the repo (tlsn, mpz2, tlsn-utils) under MIT OR Apache-2.0.
