[package]
name = "vtop-verifier"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The TLSNotary verifier of a phone's account proof: stateless, it relays the phone's TLS to VTOP and reports the verdict to Convex"

[dependencies]
vtop-core = { path = "../vtop-core", features = ["reqwest"] }
vtop-shared = { path = "../vtop-shared" }
vtop-tlsn = { path = "../vtop-tlsn", features = ["mozilla-certs"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
futures = "0.3"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
vtop-tlsn = { path = "../vtop-tlsn", features = ["fake-vtop"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = "0.29"
wiremock = "0.6"

[lints]
workspace = true
