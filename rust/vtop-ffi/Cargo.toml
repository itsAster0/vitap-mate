[package]
name = "vtop-ffi"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "UniFFI core for the app: sign-in, cache and ready-to-draw records"

[lib]
name = "vtop_ffi"
crate-type = ["cdylib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]

[features]
default = ["tlsn"]
# Only the host bindgen needs uniffi's CLI; the Android library builds without it.
cli = ["uniffi/cli", "uniffi/cargo-metadata"]
# The account proof (remote/account_proof.rs): TLSNotary's prover. Without it account calls
# that have no token fail.
tlsn = ["dep:vtop-tlsn"]

[dependencies]
vtop-core = { path = "../vtop-core" }
vtop-shared = { path = "../vtop-shared" }
# The UDP route; its client runs on the app's sockets (`udp::UdpNetwork`), not tokio's.
vtop-wire = { path = "../vtop-wire", default-features = false }
# The account proof's prover; it runs on any executor, so no tokio here either.
vtop-tlsn = { path = "../vtop-tlsn", optional = true }
# The Convex client (src/convex): the sync protocol's messages and their JSON. No tokio.
convex_sync_types = "=0.10.2"
# Its JSON conversions name anyhow's error, so values implementing them do too.
anyhow = "1"
futures = "0.3"
# The app's own executor (runtime.rs): work that outlives its caller (the fetch queue, the sweep,
# sync, consent timeouts) with task handles that cancel on drop, a timer and `unblock`. Not
# tokio, and its sockets stay unused: the network is the platform's.
smol = "2"
# No tokio: async exports run on the futures Kotlin polls (see vtop_core::sync).
uniffi = { version = "0.32.2", default-features = false }
# UniFFI's foreign async traits (HttpTransport) need it; already in the tree via vtop-mcp.
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "tracing-log"] }
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3"

[dev-dependencies]
# Host tests have no app transport: vtop-core's reqwest one stands in (resolver 2 keeps this
# feature out of the app build).
vtop-core = { path = "../vtop-core", features = ["reqwest"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
vtop-tlsn = { path = "../vtop-tlsn", features = ["fake-vtop"] }
tokio-util = { version = "0.7", features = ["compat"] }

[lints]
workspace = true
