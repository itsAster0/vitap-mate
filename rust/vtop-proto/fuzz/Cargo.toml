# The parser fuzzer: `mise run fuzz` (cargo fuzz run parsers). Its own workspace,
# so the main one (stable, `cargo test --workspace`) never builds it.
[package]
name = "vtop-proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
vtop-proto = { path = ".." }

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
