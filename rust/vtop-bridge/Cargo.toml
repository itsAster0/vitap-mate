[package]
name = "vtop-bridge"
version = "0.1.0"
edition = "2021"
description = "The engine: VTOP sessions, sign-in and the MCP tools for the Cloudflare edge"

[dependencies]
vtop-core = { path = "../vtop-core" }
vtop-shared = { path = "../vtop-shared" }
vtop-mcp = { path = "../vtop-mcp" }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
base64 = "0.22.1"
aes-gcm = "0.10"
sha2 = "0.10"
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
