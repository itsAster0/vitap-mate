[package]
name = "vtop-shared"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Formats shared by the app and the engine (the edge Worker keeps a TypeScript copy): no I/O, builds for native and wasm."

[dependencies]
aes-gcm = "0.11"
base64 = "0.23.1"
brotli-decompressor = "6"
ed25519-dalek = "3"
hex = "0.4"
getrandom = "0.4"
hkdf = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
