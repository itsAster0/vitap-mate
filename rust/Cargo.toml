[workspace]
# 2: dev-dependency features (vtop-ffi's tests turn on vtop-core/reqwest)
# stay out of the app build.
resolver = "2"
members = ["vtop-shared", "vtop-proto", "vtop-core", "vtop-bridge", "vtop-mcp", "vtop-wire", "vtop-gateway", "vtop-ffi"]

[workspace.dependencies]
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json", "multipart", "cookies", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0" }
log = "0.4"

# The app library is size-optimised. The server builds with `--profile server`.
[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "z" # Optimize more aggressively for binary size
strip = true # Remove debug symbols

[profile.server]
inherits = "release"
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
