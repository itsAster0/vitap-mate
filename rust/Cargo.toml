[workspace]
# 2: dev-dependency features (vtop-ffi's tests turn on vtop-core/reqwest)
# stay out of the app build.
resolver = "2"
members = ["vtop-shared", "vtop-proto", "vtop-core", "vtop-bridge", "vtop-mcp", "vtop-wire", "vtop-gateway", "vtop-ffi"]

[workspace.dependencies]
# 0.13's `rustls` feature means aws-lc-rs and the system's certificates, which the server
# images do not carry: clients get a preconfigured rustls with ring and the bundled
# webpki roots instead (`vtop_core::client::https_client`), as 0.12's `rustls-tls-webpki-roots`.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "multipart", "cookies", "gzip", "brotli", "form", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0" }
log = "0.4"

# The app library is size-optimised. The server builds with `--profile server`.
[profile.release]
panic = "unwind" # A panic fails the one call (UniFFI turns it into an exception) instead of closing the app
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "z" # Optimize more aggressively for binary size
strip = true # Remove debug symbols

[profile.server]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
