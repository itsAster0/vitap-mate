[package]
name = "rust_lib_vitapmate"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = ["vtop-core", "vtop-server"]

[workspace.dependencies]
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "json", "multipart", "cookies", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43.0" }
log = "0.4"

[dependencies]
vtop-core = { path = "vtop-core" }
flutter_rust_bridge = "=2.12.0"
serde = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["full"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


# The app library is size-optimised. The server builds with `--profile server`.
[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols

[profile.server]
inherits = "release"
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
