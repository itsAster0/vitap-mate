[profile.server]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

# Line tables only: backtraces keep file:line, and dev builds and target/ stay smaller.
[profile.dev]
debug = "line-tables-only"

# tlsn's MPC circuits, brotli-compressed: 4.9 MB off the app's .so (see the crate's Cargo.toml).
[patch."https://github.com/tlsnotary/mpz2"]
mpz-circuits-data = { path = "vendor/mpz-circuits-data" }
