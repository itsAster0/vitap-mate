# fly.toml app configuration file generated for vitapmate-node on 2026-10-28T17:29:34+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vitapmate-node'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile.engine'

[env]
  BIND = 'fly-global-services'
  EDGE_URL = 'https://vmate-api.aster0.dev'
  PORT = '8080'
  PORTS = '3478,51820,443'
  RUST_LOG = 'warn,vtop_bridge=info,vtop_gateway=info'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[services]]
  protocol = 'udp'
  internal_port = 3478

  [[services.ports]]
    port = 3478

[[services]]
  protocol = 'udp'
  internal_port = 51820

  [[services.ports]]
    port = 51820

[[services]]
  protocol = 'udp'
  internal_port = 443

  [[services.ports]]
    port = 443

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
