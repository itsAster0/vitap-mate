[package]
name = "vtop-core"
version = "0.1.0"
edition = "2021"
description = "VTOP client, session handling and HTML parsers, with no FFI dependencies"

[dependencies]
vtop-shared = { path = "../vtop-shared" }
vtop-proto = { path = "../vtop-proto" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
log = { workspace = true }
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
httpdate = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
