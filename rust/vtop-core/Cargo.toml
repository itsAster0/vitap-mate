[package]
name = "vtop-core"
version = "0.1.0"
edition = "2021"
description = "VTOP client, session handling and HTML parsers, with no FFI dependencies"

[dependencies]
vtop-shared = { path = "../vtop-shared" }
vtop-proto = { path = "../vtop-proto" }
# The server's transport and the Gmail OTP reader. The app (vtop-ffi) leaves
# it off and passes its own transport.
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
# The server's timers (Gmail polling, retry pauses); the app has none (see `sync`).
tokio = { workspace = true, features = ["time"], optional = true }
log = { workspace = true }
base64 = { version = "0.22.1", optional = true }

[features]
reqwest = ["dep:reqwest", "dep:base64", "dep:serde_json", "dep:tokio"]

[[example]]
name = "captcha_samples"
required-features = ["reqwest"]

[dev-dependencies]
serde_json = { workspace = true }
httpdate = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
