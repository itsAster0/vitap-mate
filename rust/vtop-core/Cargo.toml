[package]
name = "vtop-core"
version = "0.1.0"
edition = "2021"
description = "VTOP client, session handling and HTML parsers, with no FFI dependencies"

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
log = { workspace = true }
scraper = "0.23.1"
base64 = "0.22.1"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
