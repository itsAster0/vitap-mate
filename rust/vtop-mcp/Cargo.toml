[package]
name = "vtop-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing VTOP data through sessions from vtop-bridge"

[dependencies]
vtop-core = { path = "../vtop-core" }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait = "0.1"
sha2 = "0.10"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
