[package]
name = "vtop-edge"
version = "0.1.0"
edition = "2021"
description = "The Cloudflare edge: mail OTP, app installs and their event channel."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vtop-shared = { path = "../vtop-shared" }
worker = "0.8.7"
serde = { workspace = true }
serde_json = { workspace = true }
mail-parser = { version = "0.11.9", default-features = false }
base64 = "0.22.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
