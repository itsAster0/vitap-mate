# The Cloudflare edge, in TypeScript.
# Deployed with Alchemy (alchemy.run.ts: `bun run deploy`); this file is kept
# for `wrangler dev` and the tests. Keep the two in step.
# Secrets (wrangler secret put):
#   FIREBASE_CREDENTIALS_JSON  service account for FCM (same as the engine)
#   INTERNAL_TOKEN             shared with the engine and the UDP gateway:
#                              sent on every call to the engine, required
#                              on /internal/*
# The engine (vtop-bridge) runs on Railway from ../Dockerfile.engine, at
# ENGINE_URL below; UDP mode's gateway runs on the VPS (../vps) and reports
# its host, ports and keys to POST /internal/udp-keys.
#
# A new Worker (the old `vitapmate-edge` on vmate-api.aster0.dev is left
# as it was), so its Durable Objects start from one migration.
name = "vmate-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "vmate.aster0.dev", custom_domain = true }]

[vars]
# Every address the edge uses; nothing is hard-coded. ENGINE_URL serves the
# engine routes and /mcp.
MAIL_DOMAIN = "vmate.aster0.dev"
ENGINE_URL = "https://engine-v2-production.up.railway.app"
FCM_URL = "https://fcm.googleapis.com"
# This Worker's own address, for links it hands out; MCP clients get its /mcp.
PUBLIC_URL = "https://vmate.aster0.dev"
# Comma-separated origins allowed by CORS; empty allows every origin.
ALLOWED_ORIGINS = ""
# Where other @MAIL_DOMAIN mail goes; empty rejects it.
FALLBACK_FORWARD = ""

[observability.logs]
enabled = true
invocation_logs = true

# Request traces, including Durable Object calls (kept 7 days). Every
# request while traffic is low; lower the rate as it grows, since stored
# spans count toward Observability usage from 1 Dec 2026.
[observability.traces]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "DEVICE"
class_name = "Device"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "INDEX"
class_name = "Index"

[[durable_objects.bindings]]
name = "FCM_TOKEN"
class_name = "FcmToken"

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Device", "Mailbox", "Index", "FcmToken", "Account"]
