[package]
name = "vtop-wire"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The phone ↔ gateway UDP transport for slow, lossy networks: Noise IK, explicit-counter framing, Reed-Solomon repair. Used by the app and by vtop-gateway."

[dependencies]
chacha20poly1305 = "0.11"
reed-solomon-simd = "3"
# The same versions as vtop-shared, so the app's library has one copy of each.
getrandom = "0.4"
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1"
# Only for `client::fetch` over tokio's sockets; the app passes its own `client::Net`.
tokio = { workspace = true, features = ["net", "time"], optional = true }
log = { workspace = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dev-dependencies]
# Only to check `noise` against: the wire bytes must stay what the deployed gateway speaks.
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom", "risky-raw-split"] }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
