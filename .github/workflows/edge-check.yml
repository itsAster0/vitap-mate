name: Edge Check

on:
  push:
    branches: [main]
    paths:
      - "rust/vtop-edge/**"
      - "!**/*.md"
      - ".github/workflows/edge-check.yml"
  pull_request:
    paths:
      - "rust/vtop-edge/**"
      - "!**/*.md"
      - ".github/workflows/edge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check edge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/vtop-edge

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up bun
        uses: jdx/mise-action@v2
        with:
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test
