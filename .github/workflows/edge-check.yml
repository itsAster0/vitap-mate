name: Edge Check

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - "rust/vtop-shared/vectors/**"
      - "!**/*.md"
      - ".github/workflows/edge-check.yml"
  pull_request:
    paths:
      - "edge/**"
      - "rust/vtop-shared/vectors/**"
      - "!**/*.md"
      - ".github/workflows/edge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check edge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test
