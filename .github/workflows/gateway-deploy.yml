name: Gateway Deploy

# Builds the UDP gateway for the VPS (x86_64), pushes it to GHCR and
# restarts it there. The engine deploys from Railway on its own.
on:
  push:
    branches: [main]
    paths:
      - "rust/vtop-gateway/**"
      - "rust/vtop-wire/**"
      - "rust/vtop-shared/**"
      - "rust/Cargo.lock"
      - "rust/Dockerfile.gateway"
      - "rust/vps/**"
      - ".github/workflows/gateway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy the gateway
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4

      # GHCR names are lowercase; the owner follows the repo if it moves.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vitapmate-gateway" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: rust
          file: rust/Dockerfile.gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # VPS_HOST, VPS_USER, VPS_SSH_KEY (a deploy key) and VPS_KNOWN_HOSTS
      # (`ssh-keyscan <host>`). Without them the image is only pushed.
      - name: Restart on the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        if: env.HAS_VPS == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp rust/vps/compose.yml rust/vps/resolv.conf "$USER@$HOST:vitapmate-gateway/"
          ssh "$USER@$HOST" \
            'cd vitapmate-gateway && docker compose pull && docker compose up -d && docker image prune -f'
