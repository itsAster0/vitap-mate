name: Rust Check

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "!**/*.md"
      - ".github/workflows/rust-check.yml"
  pull_request:
    paths:
      - "rust/**"
      - "!**/*.md"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly-2026-11-01 # rust/rust-toolchain.toml
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Advisories, licences, duplicate crates and sources, as rust/deny.toml sets them.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-deny

      - name: Dependencies (cargo deny)
        run: cargo deny check

      # Builds the parser fuzzer (rust/vtop-proto/fuzz) so it keeps compiling; it
      # runs locally with `mise run fuzz`.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-fuzz

      # taiki-e/install-action ships a musl cargo-fuzz binary, whose baked-in default target is
      # x86_64-unknown-linux-musl (not installed, and incompatible with ASan's dynamic libc).
      - name: Build the parser fuzzer
        working-directory: rust/vtop-proto/fuzz
        run: cargo fuzz build --target x86_64-unknown-linux-gnu parsers
