name: Server Check

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "mail/**"
      - "proxy/**"
      - "deploy/**"
      - "rust/vtop-shared/vectors/**"
      - "!**/*.md"
      - ".github/workflows/server-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "mail/**"
      - "proxy/**"
      - "deploy/**"
      - "rust/vtop-shared/vectors/**"
      - "!**/*.md"
      - ".github/workflows/server-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Check backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

  mail:
    name: Check mail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

  proxy:
    name: Check proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

  deploy:
    name: Check deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up bun
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: bun
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check
