name: App Release
# A tag v<versionName> (app/module.yaml) builds the signed APK and AAB and
# uploads the AAB to the Play internal track. Run by hand to build without
# uploading, or to upload too.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the AAB to the Play internal track
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
env:
  # Only the tools the release needs; mise.toml also lists bun, firebase and
  # the Kotlin compiler for local use.
  MISE_AUTO_INSTALL: "false"
jobs:
  release:
    name: Build and upload to Play
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          name=$(sed -n 's/^ *versionName: *"\(.*\)".*/\1/p' app/module.yaml)
          code=$(sed -n 's/^ *versionCode: *\([0-9]*\).*/\1/p' app/module.yaml)
          [ "v$name" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, versionName $name" >&2; exit 1; }
          echo "versionName $name, versionCode $code"
      # Java, the Kotlin Toolchain and Ruby (fastlane) at the versions in mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install_args: java kotlin-toolchain ruby
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: mise run rust-android
      # KEY_STORE: base64 of keystore.properties; UPLOAD_RELEASE: base64 of the
      # upload keystore; ENV_JSON: .env.json as is (Firebase values);
      # PLAY_SERVICE_ACCOUNT_JSON: the Play service account key as is.
      - name: Write secrets
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          UPLOAD_RELEASE: ${{ secrets.UPLOAD_RELEASE }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for s in KEY_STORE UPLOAD_RELEASE ENV_JSON PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!s}" ] || { echo "secret $s is not set" >&2; exit 1; }
          done
          umask 077
          mkdir -p keystore
          printf '%s' "$KEY_STORE" | base64 --decode > keystore/keystore.properties
          store=$(awk -F= '$1 == "storeFile" { sub(/^[^=]*=/, ""); sub(/\r$/, ""); print; exit }' keystore/keystore.properties)
          printf '%s' "$UPLOAD_RELEASE" | base64 --decode > "keystore/$(basename "$store")"
          printf '%s' "$ENV_JSON" > .env.json
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > keystore/play-service-account.json
      - name: Write Firebase resources
        run: mise run firebase
      - name: Build signed APK
        run: mise run release
      - name: Build signed AAB
        run: mise run bundle
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-release
          path: |
            build/vitapmate-release.apk
            build/vitapmate-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Install fastlane
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        run: bundle install
      - name: Upload to Play internal track
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        run: bundle exec fastlane android deploy_internal build:false
      - name: Remove secrets
        if: always()
        run: rm -rf keystore app/keystore.properties .env.json app/res/values/firebase.xml
