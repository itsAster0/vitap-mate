name: App Release
# A tag v<versionName> (app/module.yaml) builds the signed AAB (64-bit and
# 32-bit) and uploads it to the Play internal track. Run by hand to build it
# without uploading, or to upload too. The APKs come from App Build's nightly.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the AAB to the Play internal track
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
env:
  # Only the tools the release needs; mise.toml also lists bun, firebase and
  # the Kotlin compiler for local use.
  MISE_AUTO_INSTALL: "false"
jobs:
  release:
    name: Build and upload to Play
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          name=$(sed -n 's/^ *versionName: *"\(.*\)".*/\1/p' app/module.yaml)
          code=$(sed -n 's/^ *versionCode: *\([0-9]*\).*/\1/p' app/module.yaml)
          [ "v$name" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, versionName $name" >&2; exit 1; }
          echo "versionName $name, versionCode $code"
      # Java, the Kotlin Toolchain and Ruby (fastlane) at the versions in mise.toml.
      # No caches in the release: the signed AAB is built only from fresh downloads,
      # so a poisoned cache from another run can't reach Play.
      - name: Set up mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install_args: java kotlin-toolchain ruby
          cache: false
      # The pinned nightly from rust/rust-toolchain.toml (-Zbuild-std needs rust-src).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-11-01
          components: rust-src
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Install cargo-ndk
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-ndk
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: mise run rust-android
      # KEY_STORE: base64 of keystore.properties; UPLOAD_RELEASE: base64 of the
      # upload keystore; ENV_JSON: .env.json as is (Firebase values);
      # PLAY_SERVICE_ACCOUNT_JSON: the Play service account key as is.
      - name: Write secrets
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          UPLOAD_RELEASE: ${{ secrets.UPLOAD_RELEASE }}
          ENV_JSON: ${{ secrets.ENV_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for s in KEY_STORE UPLOAD_RELEASE ENV_JSON PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!s}" ] || { echo "secret $s is not set" >&2; exit 1; }
          done
          umask 077
          mkdir -p keystore
          printf '%s' "$KEY_STORE" | base64 --decode > keystore/keystore.properties
          store=$(awk -F= '$1 == "storeFile" { sub(/^[^=]*=/, ""); sub(/\r$/, ""); print; exit }' keystore/keystore.properties)
          printf '%s' "$UPLOAD_RELEASE" | base64 --decode > "keystore/$(basename "$store")"
          printf '%s' "$ENV_JSON" > .env.json
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > keystore/play-service-account.json
      - name: Write Firebase resources
        run: mise run firebase
      - name: Build signed AAB
        run: mise run bundle
      - name: Install fastlane
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        run: bundle install
      - name: Upload to Play internal track
        if: startsWith(github.ref, 'refs/tags/') || inputs.upload
        run: bundle exec fastlane android deploy_internal build:false
      - name: Remove secrets
        if: always()
        run: rm -rf keystore app/keystore.properties .env.json app/res/values/firebase.xml
