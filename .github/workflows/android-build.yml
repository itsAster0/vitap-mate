name: App Build
on:
  push:
    branches: [main]
    # Parts of the repo the app is not built from: the edge Worker, the
    # engine's crates, the gateway, the browser extension and docs.
    paths-ignore:
      - "rust/vtop-edge/**"
      - "rust/vtop-bridge/**"
      - "rust/vtop-mcp/**"
      - "rust/vtop-gateway/**"
      - "rust/vps/**"
      - "rust/Dockerfile.*"
      - "extension/**"
      - "fastlane/**"
      - ".github/workflows/extension-build.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "rust/vtop-edge/**"
      - "rust/vtop-bridge/**"
      - "rust/vtop-mcp/**"
      - "rust/vtop-gateway/**"
      - "rust/vps/**"
      - "rust/Dockerfile.*"
      - "extension/**"
      - "fastlane/**"
      - ".github/workflows/extension-build.yml"
      - "**/*.md"
  workflow_dispatch:
permissions:
  # `contents: write` only to replace the `nightly` release on a push to main.
  contents: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
env:
  # Only the tools the build needs; mise.toml also lists firebase and the
  # Kotlin compiler for local use.
  MISE_AUTO_INSTALL: "false"
jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Java and the Kotlin Toolchain at the versions pinned in mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install_args: java kotlin-toolchain
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 and armeabi-v7a for phones, x86_64 for emulators (as `mise run rust-android`).
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      # libvtop_ffi.so into app/jniLibs and the Kotlin bindings into core/src.
      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: mise run rust-android
      # Firebase values (push), as in the release; skipped where ENV_JSON isn't set (forks).
      - name: Write Firebase resources
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -z "$ENV_JSON" ]; then echo "ENV_JSON is not set; building without Firebase."; exit 0; fi
          (umask 077; printf '%s' "$ENV_JSON" > .env.json)
          mise run firebase
      # Signed release only when the repository has the keystore secrets
      # (forks and pull requests from forks do not).
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEY_STORE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.UPLOAD_RELEASE }}
        run: |
          if [ -z "$KEYSTORE_PROPERTIES_BASE64" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "KEY_STORE and UPLOAD_RELEASE secrets are not configured; skipping the signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `mise run signing` reads keystore/keystore.properties and expects
          # the keystore next to it under its storeFile name.
          mkdir -p keystore
          printf '%s' "$KEYSTORE_PROPERTIES_BASE64" | base64 --decode > keystore/keystore.properties
          store=$(awk -F= '$1 == "storeFile" { sub(/^[^=]*=/, ""); sub(/\r$/, ""); print; exit }' keystore/keystore.properties)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "keystore/$(basename "$store")"
          # app/keystore.properties, so the build below finds the signing config.
          mise run signing
          echo "signed=true" >> "$GITHUB_OUTPUT"
      # The Kotlin Toolchain's downloads (its runtime, JDKs, Android tools, Gradle
      # and Maven libraries), so a run doesn't fetch them again.
      - name: Cache Kotlin Toolchain downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            !~/.cache/JetBrains/Kotlin/telemetry
            ~/.gradle/caches
            ~/.gradle/wrapper/dists
            !~/.gradle/caches/**/*.lock
          key: kotlin-deps-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml') }}
          restore-keys: kotlin-deps-${{ runner.os }}-
      # Incremental build state from the last run, so only changed modules compile.
      - name: Cache Kotlin build
        uses: actions/cache@v4
        with:
          path: |
            build
            !build/logs
            !build/*.apk
            !build/*.apk.idsig
            !build/*.aab
          key: kotlin-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: kotlin-build-${{ runner.os }}-
      # The signed release below compiles the app itself; the debug build is
      # only for runs without the keystore (forks and their pull requests).
      - name: Build app
        if: steps.signing.outputs.signed != 'true'
        run: ./kotlin build
      - name: Test core
        run: ./kotlin test -m core
      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: mise run release --both
      - name: Remove secrets
        if: always()
        run: rm -rf keystore app/keystore.properties .env.json app/res/values/firebase.xml
      - name: Upload release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-release-apk
          path: |
            build/vitapmate-release.apk
            build/vitapmate-release-32bit.apk
          if-no-files-found: error
          retention-days: 30
      # The README links the `nightly` release; a push to main replaces it.
      - name: Publish nightly release
        if: steps.signing.outputs.signed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/vitapmate-release.apk vitapmate.apk
          cp build/vitapmate-release-32bit.apk vitapmate-32bit.apk
          version=$(sed -n 's/^ *versionName: *"\(.*\)".*/\1/p' app/module.yaml)
          {
            echo "Nightly build of vitapmate ${version}, from \`${GITHUB_SHA::7}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "**$(git log -1 --format=%s)**"
            echo
            cat .github/nightly-notes.md
          } > nightly-notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly vitapmate.apk vitapmate-32bit.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Nightly ${GITHUB_SHA::7}" --notes-file nightly-notes.md
      - name: Upload debug APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-debug-apk
          path: build/tasks/_app_buildAndroidDebug/gradle-project-debug.apk
          if-no-files-found: error
          retention-days: 30
