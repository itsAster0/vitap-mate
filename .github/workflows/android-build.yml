name: Android Build
on:
  push:
    branches: [main]
    # Parts of the repo the app is not built from: the edge Worker, the
    # engine's crates, the browser extension and docs.
    paths-ignore:
      - "rust/vtop-edge/**"
      - "rust/vtop-bridge/**"
      - "rust/vtop-mcp/**"
      - "rust/Dockerfile.engine"
      - "extension/**"
      - ".github/workflows/extension-build.yml"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # ARM only: x86_64 served just emulators and ChromeOS.
          targets: aarch64-linux-android,armv7-linux-androideabi
      # Cargokit builds the Rust library into the Flutter build directory,
      # not rust/target, so point the cache there.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> ../build/rust_lib_vitapmate/build
          cache-directories: build/rust_lib_vitapmate/build_tool
          cache-on-failure: true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4
      - name: Write secrets from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [ -z "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
            echo "OP_SERVICE_ACCOUNT_TOKEN secret is not configured."
            exit 1
          fi

          tool/secrets.sh env signing
          missing=$(jq -r '
            . as $env |
            [
              "FIREBASE_ANDROID_API_KEY",
              "FIREBASE_ANDROID_APP_ID",
              "FIREBASE_MESSAGING_SENDER_ID",
              "FIREBASE_PROJECT_ID",
              "FIREBASE_STORAGE_BUCKET"
            ][] | select(($env[.] // "") == "")
          ' .env.json)
          if [ -n "$missing" ]; then
            echo ".env.json is missing:"
            echo "$missing"
            exit 1
          fi
      - name: Build universal release APK
        run: |
          flutter build apk --release --flavor prod \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file=.env.json
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk \
            build/artifacts/vitapmate-universal.apk
      - name: Build release APKs for each architecture
        run: |
          flutter build apk --release --flavor prod --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define-from-file=.env.json
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk \
            build/artifacts/vitapmate-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk \
            build/artifacts/vitapmate-armeabi-v7a.apk
      - name: Remove secrets
        if: always()
        run: |
          rm -f .env.json android/keystore.properties \
            android/upload-keystore.jks
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-universal-apk
          path: build/artifacts/vitapmate-universal.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ARM 64-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-arm64-v8a-apk
          path: build/artifacts/vitapmate-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload ARM 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-armeabi-v7a-apk
          path: build/artifacts/vitapmate-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          {
            echo "Automated build of \`${short_sha}\` on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "**$(git log -1 --format=%s)**"
            echo
            echo "Not a stable release. Most people should use \`vitapmate-universal.apk\`."
          } > nightly-notes.md

          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly build/artifacts/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${short_sha}" \
            --notes-file nightly-notes.md
