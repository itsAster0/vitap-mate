name: App Build
on:
  push:
    branches: [main]
    # Parts of the repo the app is not built from: the edge Worker, the
    # engine's crates, the gateway, the browser extension and docs.
    paths-ignore:
      - "rust/vtop-edge/**"
      - "rust/vtop-bridge/**"
      - "rust/vtop-mcp/**"
      - "rust/vtop-gateway/**"
      - "rust/vps/**"
      - "rust/Dockerfile.*"
      - "extension/**"
      - "fastlane/**"
      - ".github/workflows/extension-build.yml"
      - ".github/workflows/gateway-deploy.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "rust/vtop-edge/**"
      - "rust/vtop-bridge/**"
      - "rust/vtop-mcp/**"
      - "rust/vtop-gateway/**"
      - "rust/vps/**"
      - "rust/Dockerfile.*"
      - "extension/**"
      - "fastlane/**"
      - ".github/workflows/extension-build.yml"
      - ".github/workflows/gateway-deploy.yml"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
env:
  # Only the tools the build needs; mise.toml also lists firebase and the
  # Kotlin compiler for local use.
  MISE_AUTO_INSTALL: "false"
jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      # Java and the Kotlin Toolchain at the versions pinned in mise.toml.
      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install_args: java kotlin-toolchain
          cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 for phones, x86_64 for emulators (as `mise run rust-android`).
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-on-failure: true
      # libvtop_ffi.so into app/jniLibs and the Kotlin bindings into core/src.
      - name: Build Rust library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: mise run rust-android
      - name: Build app
        run: ./kotlin build
      - name: Test core
        run: ./kotlin test -m core
      # Signed release only when the repository has the keystore secrets
      # (forks and pull requests from forks do not).
      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEY_STORE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.UPLOAD_RELEASE }}
        run: |
          if [ -z "$KEYSTORE_PROPERTIES_BASE64" ] || [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "KEY_STORE and UPLOAD_RELEASE secrets are not configured; skipping the signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `mise run signing` reads keystore/keystore.properties and expects
          # the keystore next to it under its storeFile name.
          mkdir -p keystore
          printf '%s' "$KEYSTORE_PROPERTIES_BASE64" | base64 --decode > keystore/keystore.properties
          store=$(awk -F= '$1 == "storeFile" { sub(/^[^=]*=/, ""); sub(/\r$/, ""); print; exit }' keystore/keystore.properties)
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "keystore/$(basename "$store")"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: mise run release
      - name: Remove secrets
        if: always()
        run: rm -rf keystore app/keystore.properties
      - name: Upload release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-release-apk
          path: build/vitapmate-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vitapmate-debug-apk
          path: build/tasks/_app_buildAndroidDebug/gradle-project-debug.apk
          if-no-files-found: error
          retention-days: 30
