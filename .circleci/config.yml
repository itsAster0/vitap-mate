# Trial of CircleCI next to GitHub Actions: builds and tests the app (debug APK)
# on every commit. GitHub's App Build still signs and publishes the `nightly` release.
version: 2.1

jobs:
  build-apk:
    docker:
      - image: cimg/base:current
    resource_class: large
    environment:
      # Only the tools the build needs; mise.toml also lists firebase, bun and ruby.
      MISE_AUTO_INSTALL: "false"
      ANDROID_NDK_HOME: /home/circleci/android-ndk-r28c
    steps:
      - checkout
      - restore_cache:
          keys:
            - tools-v1-{{ checksum "mise.toml" }}
            - tools-v1-
      - run:
          name: Install mise, Java and the Kotlin Toolchain
          command: |
            command -v mise >/dev/null || curl -fsSL https://mise.run | sh
            echo 'export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.local/bin:$PATH"
            mise trust
            mise install java kotlin-toolchain
      # arm64 and armeabi-v7a for phones, x86_64 for emulators (as `mise run rust-android`).
      - run:
          name: Install Rust and cargo-ndk
          command: |
            command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk
      - run:
          name: Install Android NDK r28c
          command: |
            [ -d "$ANDROID_NDK_HOME" ] && exit 0
            curl -fLo /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
            unzip -q /tmp/ndk.zip -d "$HOME" && rm /tmp/ndk.zip
      - save_cache:
          key: tools-v1-{{ checksum "mise.toml" }}
          paths:
            - ~/.local/bin/mise
            - ~/.local/share/mise
            - ~/.rustup
            - ~/.cargo/bin
            - ~/android-ndk-r28c
      - restore_cache:
          keys:
            - rust-v1-{{ checksum "rust/Cargo.lock" }}
            - rust-v1-
      # libvtop_ffi.so into app/jniLibs and the Kotlin bindings into core/src.
      - run:
          name: Build Rust library
          command: mise run rust-android
      - save_cache:
          key: rust-v1-{{ checksum "rust/Cargo.lock" }}
          paths:
            - rust/target
            - ~/.cargo/registry
      # The Kotlin Toolchain's downloads (runtime, JDKs, Android tools, Maven libraries).
      - restore_cache:
          keys:
            - kotlin-v1-{{ checksum "project.yaml" }}
            - kotlin-v1-
      - run:
          name: Build app
          command: ./kotlin build
      - run:
          name: Test core
          command: ./kotlin test -m core
      - save_cache:
          key: kotlin-v1-{{ checksum "project.yaml" }}
          paths:
            - ~/.cache/JetBrains/Kotlin
            - ~/.gradle/caches
            - ~/.gradle/wrapper/dists
      - store_artifacts:
          path: build/tasks/_app_buildAndroidDebug/gradle-project-debug.apk
          destination: vitapmate-debug.apk

workflows:
  build:
    jobs:
      - build-apk
