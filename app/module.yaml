product: android/app
dependencies:
  - //design
  - //features/login
  - //features/attendance
  - //features/timetable
  - //features/calendar
  - //features/marks
  - //features/exams
  - //features/coursepage
  - //features/docs
  - //features/grades
  - //features/outing
  - //features/profile
  - //features/biometric
  - //features/vtop
  - androidx.activity:activity-compose:1.13.0
  # Typed back stack and predictive back for the shell (Compose Multiplatform build).
  - org.jetbrains.androidx.navigation3:navigation3-ui:1.2.0
  # Background sync (Settings → Background sync): periodic, survives reboots and Doze.
  - androidx.work:work-runtime:2.11.2
  # Push from the edge (session requests, the event log); configured by `mise run firebase`.
  - com.google.firebase:firebase-messaging:26.0.1
  # Settings → Connected apps → Pair a browser: Play services' QR scanner (its own UI, no CAMERA permission).
  - com.google.android.gms:play-services-code-scanner:16.1.0
settings:
  android:
    # Release is signed from keystore.properties (gitignored; `mise run signing`).
    signing: enabled
    applicationId: com.vitap_pal.app
    versionCode: 3000000
    versionName: "3.0.0"
    namespace: vitapmate
    minSdk: 24
    abiFilters: [arm64-v8a]
    resourcePackaging:
      excludes:
        - META-INF/*.version
        - kotlin/**
        - DebugProbesKt.bin
  compose: enabled
  jvm:
    jdk:
      version: 26
