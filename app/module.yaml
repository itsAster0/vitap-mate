product: android/app
dependencies:
  - //design
  - //features/login
  - //features/attendance
  - //features/timetable
  - //features/calendar
  - //features/marks
  - //features/exams
  - //features/coursepage
  - //features/docs
  - //features/grades
  - //features/outing
  - //features/profile
  - //features/biometric
  - //features/vtop
  - //features/wrapped
  - androidx.activity:activity-compose:1.13.0
  # Typed back stack and predictive back for the shell (Compose Multiplatform build).
  - org.jetbrains.androidx.navigation3:navigation3-ui:1.2.0
  # Push from the edge (session requests, the event log); configured by `mise run firebase`.
  - com.google.firebase:firebase-messaging:26.0.2
  # Play's flexible in-app updates (PlayUpdate).
  - com.google.android.play:app-update:2.1.0
  # Settings → Assistant: the timetable and attendance as Android app functions (AssistantFunctions, Android 16+).
  - androidx.appfunctions:appfunctions:1.0.0
settings:
  android:
    signing: enabled
    applicationId: com.vitap_pal.app
    versionCode: 3001004
    versionName: "3.1.0"
    namespace: vitapmate
    minSdk: 28
    # Compose 1.13 needs Android 37.1 to compile against.
    compileSdk:
      minorApiLevel: 1
    # armeabi-v7a: phones on 32-bit Android (mise run rust-android builds both).
    abiFilters: [arm64-v8a, armeabi-v7a]
    resourcePackaging:
      excludes:
        - META-INF/*.version
        - kotlin/**
        - DebugProbesKt.bin
        # Licence texts and build metadata nothing reads at run time.
        - META-INF/**/LICENSE.txt
        - META-INF/AL2.0
        - META-INF/LGPL2.1
        - META-INF/*.textproto
        - META-INF/kotlin-project-structure-metadata.json
        - "*.proto"
  kotlin:
    ksp:
      # Generates VitapmateFunctions and its XML from AssistantFunctions.
      processors:
        - androidx.appfunctions:appfunctions-compiler:1.0.0
  compose:
    enabled: true
    version: 1.13.0-rc01
  jvm:
    jdk:
      version: 26
